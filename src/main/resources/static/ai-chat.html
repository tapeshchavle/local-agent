<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Local AI Chat</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

    <style>
        :root {
            --ink: #121a2b;
            --panel: #1a2338;
            --line: #2b3652;
            --user: #243049;
            --text: #e8e6df;
            --muted: #98a2b8;
            --amber: #e3a857;
            --danger: #f0897b;
            --sans: "IBM Plex Sans", system-ui, sans-serif;
            --serif: "Source Serif 4", Georgia, serif;
            --mono: "JetBrains Mono", Consolas, monospace;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            background: var(--ink);
            color: var(--text);
            font-family: var(--sans);
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

        .app { height: 100%; display: flex; flex-direction: column; }

        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 22px;
            border-bottom: 1px solid var(--line);
        }
        header h1 { margin: 0; font-size: 16px; font-weight: 600; }
        .model { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #5fb88a; }
        .dot.busy { background: var(--amber); animation: pulse 1s ease-in-out infinite; }
        @keyframes pulse { 50% { opacity: .3; } }

        #messages { flex: 1; overflow-y: auto; padding: 28px 18px 12px; }
        #thread { max-width: 760px; margin: 0 auto; }

        .empty { padding: 8vh 0 0; }
        .empty h2 { font: 600 28px/1.25 var(--serif); margin: 0 0 8px; }
        .empty p { color: var(--muted); margin: 0 0 22px; }
        .chips { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
        .chip {
            font: inherit; font-size: 14px; text-align: left;
            color: var(--text); background: var(--panel);
            border: 1px solid var(--line); border-radius: 10px;
            padding: 10px 14px; cursor: pointer;
        }
        .chip:hover { border-color: var(--amber); }

        .turn { margin-bottom: 30px; }
        .user {
            margin-left: auto; width: fit-content; max-width: 85%;
            background: var(--user); padding: 10px 15px;
            border-radius: 14px 14px 4px 14px;
            white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55;
        }

        .answer {
            font-family: var(--serif); font-size: 17px; line-height: 1.75;
            overflow-wrap: anywhere;
        }
        .answer > :first-child { margin-top: 0; }
        .answer p { margin: 0 0 16px; }
        .answer h1, .answer h2, .answer h3 {
            font-family: var(--sans); line-height: 1.35; margin: 28px 0 10px;
        }
        .answer h1 { font-size: 22px; } .answer h2 { font-size: 19px; } .answer h3 { font-size: 16px; }
        .answer ul, .answer ol { padding-left: 24px; margin: 0 0 16px; }
        .answer li { margin: 6px 0; }
        .answer a { color: var(--amber); }
        .answer blockquote {
            margin: 0 0 16px; padding-left: 14px;
            border-left: 3px solid var(--amber); color: var(--muted);
        }
        .answer :not(pre) > code {
            font-family: var(--mono); font-size: .85em;
            background: var(--panel); padding: 2px 6px; border-radius: 4px;
        }
        .answer table { display: block; overflow-x: auto; border-collapse: collapse; margin-bottom: 16px; font-family: var(--sans); font-size: 14px; }
        .answer th, .answer td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; }
        .answer th { background: var(--panel); }

        .code-block { margin: 0 0 18px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
        .code-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 12px; background: var(--panel);
            font: 12px var(--sans); color: var(--muted);
        }
        .copy {
            font: inherit; color: var(--text); background: none;
            border: 1px solid var(--line); border-radius: 6px;
            padding: 3px 10px; cursor: pointer;
        }
        .copy:hover { border-color: var(--amber); }
        .code-block pre { margin: 0; padding: 14px 16px; overflow-x: auto; background: #0d1424; }
        .code-block pre code { font-family: var(--mono); font-size: 13px; line-height: 1.6; background: none; padding: 0; }
        .answer > pre { padding: 14px 16px; overflow-x: auto; background: #0d1424; border-radius: 10px; }
        .hljs { background: transparent; padding: 0; }

        .answer.streaming::after {
            content: ""; display: inline-block; width: 9px; height: 9px;
            border-radius: 50%; background: var(--amber);
            animation: pulse 1s ease-in-out infinite;
        }
        .answer.error { color: var(--danger); font-family: var(--sans); font-size: 15px; }

        .composer { border-top: 1px solid var(--line); padding: 14px 16px 12px; background: var(--ink); }
        form { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
        textarea {
            flex: 1; min-width: 0; max-height: 180px; resize: none;
            padding: 12px 14px; font: inherit; line-height: 1.5;
            color: var(--text); background: var(--panel);
            border: 1px solid var(--line); border-radius: 12px;
        }
        textarea::placeholder { color: var(--muted); }
        #sendButton {
            font: inherit; font-weight: 600; padding: 12px 18px;
            color: #1b1405; background: var(--amber);
            border: 0; border-radius: 10px; cursor: pointer;
        }
        #sendButton.stop { background: var(--panel); color: var(--text); border: 1px solid var(--line); }
        #status { max-width: 760px; margin: 8px auto 0; font-size: 12px; color: var(--muted); }

        @media (max-width: 600px) {
            header { padding: 12px 14px; }
            .answer { font-size: 16px; }
            .user { max-width: 92%; }
        }
        @media (prefers-reduced-motion: reduce) {
            .dot.busy, .answer.streaming::after { animation: none; }
        }
    </style>
</head>

<body>
<div class="app">
    <header>
        <h1>Local AI Chat</h1>
        <div class="model"><span id="dot" class="dot"></span>Qwen2.5-Coder 7B on Ollama</div>
    </header>

    <main id="messages" aria-live="polite">
        <div id="thread">
            <section class="empty" id="empty">
                <h2>What are you building?</h2>
                <p>Ask about Java, Spring Boot, or system design. Answers stream in as the model writes them.</p>
                <div class="chips">
                    <button class="chip" type="button">Explain how JWT authentication works in Spring Security</button>
                    <button class="chip" type="button">Design a rate limiter for a REST API</button>
                    <button class="chip" type="button">What is the difference between @Component, @Service and @Repository?</button>
                </div>
            </section>
        </div>
    </main>

    <div class="composer">
        <form id="chatForm">
            <textarea id="prompt" rows="1" placeholder="Message your AI" aria-label="Message" required></textarea>
            <button id="sendButton" type="submit">Send</button>
        </form>
        <div id="status">Ready</div>
    </div>
</div>

<script>
    const API_URL = "/api/ai/chat";

    const scroller = document.getElementById("messages");
    const thread = document.getElementById("thread");
    const form = document.getElementById("chatForm");
    const promptInput = document.getElementById("prompt");
    const sendButton = document.getElementById("sendButton");
    const statusEl = document.getElementById("status");
    const dot = document.getElementById("dot");

    marked.setOptions({ gfm: true, breaks: true });

    let controller = null;     // set while a response is streaming
    let stickToBottom = true;  // stop auto-scroll when the user scrolls up

    scroller.addEventListener("scroll", () => {
        stickToBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80;
    });

    function scrollToBottom(force = false) {
        if (force || stickToBottom) scroller.scrollTop = scroller.scrollHeight;
    }

    function setBusy(busy) {
        dot.classList.toggle("busy", busy);
        sendButton.textContent = busy ? "Stop" : "Send";
        sendButton.classList.toggle("stop", busy);
    }

    function addTurn(question) {
        document.getElementById("empty")?.remove();

        const turn = document.createElement("div");
        turn.className = "turn";

        const user = document.createElement("div");
        user.className = "user";
        user.textContent = question;

        const answer = document.createElement("div");
        answer.className = "answer streaming";
        answer.textContent = "Thinking...";

        turn.append(user, answer);
        thread.appendChild(turn);
        scrollToBottom(true);
        return answer;
    }

    function renderMarkdown(el, markdown) {
        el.innerHTML = DOMPurify.sanitize(marked.parse(markdown));
        scrollToBottom();
    }

    // Final pass: syntax highlighting + copy buttons (done once, after streaming).
    function finalize(el, markdown) {
        renderMarkdown(el, markdown);
        el.classList.remove("streaming");

        el.querySelectorAll("pre").forEach(pre => {
            const code = pre.querySelector("code");
            if (!code) return;
            if (window.hljs) hljs.highlightElement(code);

            const lang = (code.className.match(/language-([\w+-]+)/) || [])[1] || "text";
            const wrap = document.createElement("div");
            wrap.className = "code-block";

            const bar = document.createElement("div");
            bar.className = "code-bar";
            const label = document.createElement("span");
            label.textContent = lang;
            const copy = document.createElement("button");
            copy.type = "button";
            copy.className = "copy";
            copy.textContent = "Copy";
            copy.addEventListener("click", async () => {
                try {
                    await navigator.clipboard.writeText(code.textContent);
                    copy.textContent = "Copied";
                } catch {
                    copy.textContent = "Copy failed";
                }
                setTimeout(() => (copy.textContent = "Copy"), 1500);
            });

            bar.append(label, copy);
            pre.replaceWith(wrap);
            wrap.append(bar, pre);
        });
    }

    /*
     * Smooth typing: the model sends tokens in uneven bursts. We queue them and
     * reveal a few characters per animation frame, speeding up when the queue grows.
     */
    function createTyper(el) {
        let shown = "", queue = "", raf = 0, ended = false, onEmpty = null;

        function tick() {
            raf = 0;
            if (queue) {
                let n = Math.max(2, Math.ceil(queue.length / 10));
                const c = queue.charCodeAt(n - 1);
                if (c >= 0xD800 && c <= 0xDBFF) n++;   // do not split a surrogate pair
                shown += queue.slice(0, n);
                queue = queue.slice(n);
                renderMarkdown(el, shown);
            }
            if (queue) raf = requestAnimationFrame(tick);
            else if (ended && onEmpty) onEmpty();
        }

        return {
            push(text) {
                queue += text;
                if (!raf) raf = requestAnimationFrame(tick);
            },
            drain() {                       // resolves once everything is on screen
                ended = true;
                return new Promise(resolve => {
                    onEmpty = resolve;
                    if (!queue) resolve();
                });
            },
            flush() {                       // show everything immediately (used on Stop)
                cancelAnimationFrame(raf);
                raf = 0;
                shown += queue;
                queue = "";
                return shown;
            },
            text() { return shown + queue; }
        };
    }

    /*
     * Do not trim a leading space from an SSE data value: a chunk can start with a
     * meaningful model-generated space. Only the "data:" prefix is removed.
     */
    function parseSseEvent(eventText) {
        const dataLines = [];
        for (const line of eventText.split(/\r?\n/)) {
            if (line.startsWith("data:")) dataLines.push(line.slice(5));
        }
        return dataLines.length ? dataLines.join("\n") : null;
    }

    async function streamAnswer(question, answerEl, signal) {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "text/event-stream" },
            body: JSON.stringify({ message: question }),
            signal
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}: ${await response.text()}`);
        if (!response.body) throw new Error("This browser does not support streamed responses.");

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        const typer = createTyper(answerEl);
        let buffer = "";
        let started = false;

        const handle = eventText => {
            const data = parseSseEvent(eventText);
            if (data === null) return;
            if (!started) { started = true; answerEl.textContent = ""; }
            typer.push(data);
        };

        try {
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });

                let m;
                const boundary = /\r?\n\r?\n/;
                while ((m = boundary.exec(buffer)) !== null) {
                    const eventText = buffer.slice(0, m.index);
                    buffer = buffer.slice(m.index + m[0].length);
                    if (eventText) handle(eventText);
                }
            }
            buffer += decoder.decode();
            if (buffer) handle(buffer);

            await typer.drain();
            if (!typer.text().trim()) {
                answerEl.classList.remove("streaming");
                answerEl.textContent = "The model returned an empty response.";
                return;
            }
            finalize(answerEl, typer.text());
        } catch (err) {
            if (err.name === "AbortError") {
                finalize(answerEl, typer.flush() || "_Stopped before any text arrived._");
                err.stopped = true;
            }
            throw err;
        } finally {
            reader.releaseLock?.();
        }
    }

    form.addEventListener("submit", async event => {
        event.preventDefault();

        if (controller) { controller.abort(); return; }   // button acts as Stop

        const question = promptInput.value.trim();
        if (!question) return;

        const answerEl = addTurn(question);
        promptInput.value = "";
        promptInput.style.height = "auto";

        controller = new AbortController();
        setBusy(true);
        statusEl.textContent = "Generating response...";

        try {
            await streamAnswer(question, answerEl, controller.signal);
            statusEl.textContent = "Response complete";
        } catch (err) {
            if (err.stopped) {
                statusEl.textContent = "Stopped";
            } else {
                console.error("Streaming error:", err);
                answerEl.classList.remove("streaming");
                answerEl.classList.add("error");
                answerEl.textContent =
                    "Could not get a response: " + err.message +
                    ". Check that Spring Boot is running and Ollama has the model loaded.";
                statusEl.textContent = "Request failed";
            }
        } finally {
            controller = null;
            setBusy(false);
            promptInput.focus();
        }
    });

    promptInput.addEventListener("input", () => {
        promptInput.style.height = "auto";
        promptInput.style.height = Math.min(promptInput.scrollHeight, 180) + "px";
    });

    promptInput.addEventListener("keydown", event => {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            if (!controller) form.requestSubmit();
        }
    });

    document.querySelectorAll(".chip").forEach(chip =>
        chip.addEventListener("click", () => {
            promptInput.value = chip.textContent;
            form.requestSubmit();
        })
    );
</script>
</body>
</html>
